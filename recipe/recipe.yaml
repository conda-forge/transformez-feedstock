schema_version: 1

context:
  name: transformez
  version: "1.0.1"
  python_min: "3.12"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4b8fecb3a806d0dc4a74995088294b7f7bb918ea98fccb070f3359da7fbd7508

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - transformez = transformez.cli:transformez_cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0
    - hatch-vcs
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - fetchez >=0.11.0
    - click >=8.1.7
    - numpy >=1.26.0
    - pyproj >3.6.1
    - rasterio >1.4.0
    - libgdal-netcdf
    - libgdal-hdf5
    - scipy >=1.11.2

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
      imports:
        - transformez
  - script:
      - transformez --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/continuous-dems/transformez
  summary: A standalone utility for vertical elevation datum transformations.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - matth-love
    - mfisher87
